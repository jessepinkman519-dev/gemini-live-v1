<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini Lounge — ScanCraft V2.7.2</title><style>:root{--red:#f21d3b;--red2:#ff405d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020306;overflow:hidden}#frame{width:100%;height:100%;border:0;display:block}#polish{position:fixed;inset:0;z-index:20;pointer-events:none}#polish .vtag{position:absolute;right:58px;top:14px;border:1px solid rgba(255,64,93,.5);border-radius:999px;padding:7px 12px;background:rgba(2,4,8,.58);color:#fff;font:700 10px Arial;letter-spacing:.08em;box-shadow:0 0 18px rgba(242,29,59,.12)}#polish .glow{position:absolute;left:250px;right:0;top:0;height:72px;background:linear-gradient(180deg,rgba(242,29,59,.05),transparent);mix-blend-mode:screen}#polish .bottom{position:absolute;left:250px;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,rgba(242,29,59,.65),transparent);box-shadow:0 0 18px rgba(242,29,59,.35)}</style></head><body><iframe id="frame" src="index.html"></iframe><div id="polish"><div class="vtag">SCANCRAFT · V2.7.2 EXPERIENCE POLISH</div><div class="glow"></div><div class="bottom"></div></div><script>(function(){const f=document.getElementById('frame');function tune(){try{const d=f.contentDocument;if(!d)return;const s=d.createElement('style');s.textContent=`.dashboard{align-items:stretch!important}.panel{transition:border-color .18s ease,box-shadow .18s ease}.panel:hover{border-color:rgba(255,64,93,.38);box-shadow:0 22px 60px rgba(0,0,0,.72),0 0 22px rgba(242,29,59,.06)}.btn.primary{letter-spacing:.01em}.card{transition:transform .16s ease,border-color .16s ease}.card:hover{border-color:rgba(255,64,93,.3);transform:translateY(-1px)}.hero{box-shadow:0 24px 70px rgba(0,0,0,.72),0 0 45px rgba(242,29,59,.1)}.experience{box-shadow:0 0 22px rgba(242,29,59,.14)}.footer{letter-spacing:.02em}`;d.head.appendChild(s);const nav=d.querySelectorAll('.nav button');nav.forEach((b,i)=>{if(!b.textContent.includes('Customer')&&!b.textContent.includes('My Bookings'))b.title='Gemini Lounge '+b.textContent.trim();b.addEventListener('click',()=>setTimeout(()=>{nav.forEach(x=>x.classList.remove('active'));b.classList.add('active')},0));});}catch(e){}}f.addEventListener('load',()=>setTimeout(tune,100));})();</script></body></html>
