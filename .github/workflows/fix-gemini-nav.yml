name: Fix Gemini Lounge Navigation

on: push

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation
        run: |
          python3 -c 'from pathlib import Path; import base64; p=Path("index.html"); s=p.read_text(); old=base64.b64decode("").decode(); new=base64.b64decode("").decode(); assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-gemini-nav.yml
          git add index.html .github/workflows/fix-gemini-nav.yml
          git commit -m "Fix Gemini Lounge navigation active state"
          git push
