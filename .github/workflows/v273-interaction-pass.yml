name: Gemini Lounge V2.7.3 Interaction Pass
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/v273-interaction-pass.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        env:
          PATCH_B64: .
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'SC-V273-INTERACTION' not in s:
              patch=base64.b64decode(__import__('os').environ['PATCH_B64']).decode()
              s=s.replace('<title>Gemini Lounge — ScanCraft V2.7.1</title>','<title>Gemini Lounge — ScanCraft V2.7.3</title>',1)
              s=s.replace('</body>',patch+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build Gemini Lounge V2.7.3 interaction pass' || exit 0
          git push