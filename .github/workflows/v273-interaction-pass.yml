name: Gemini Lounge V2.7.3 Interaction Pass
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply interaction layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'SC-V273-INTERACTION' not in s:
              s=s.replace('<title>Gemini Lounge — ScanCraft V2.7.1</title>','<title>Gemini Lounge — ScanCraft V2.7.3</title>',1)
              patch=Path('v273-interaction.patch').read_text(encoding='utf-8')
              s=s.replace('</body>',patch+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
              print('V2.7.3 applied')
          else:
              print('V2.7.3 already applied')
          PY
      - name: Commit interaction pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build Gemini Lounge V2.7.3 interaction pass' || exit 0
          git push