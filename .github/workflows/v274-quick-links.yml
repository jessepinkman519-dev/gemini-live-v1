name: Gemini Lounge V2.7.4 Quick Links Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quick links
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SC-V274-QUICK-LINKS -->'
          if marker not in s:
              patch='''\n<!-- SC-V274-QUICK-LINKS -->\n<script>\n(function(){\n  function install(){\n    const items=[...document.querySelectorAll('.quick-item')];\n    if(!items.length) return;\n    const routes=['bookings','events','calendar','owner','promotion'];\n    const go=name=>{\n      const btn=[...document.querySelectorAll('.nav button')].find(b=>b.dataset.tab===name);\n      if(btn) btn.click();\n    };\n    items.forEach((el,i)=>{\n      const route=routes[i];\n      if(!route || el.dataset.scV274Bound) return;\n      el.dataset.scV274Bound='1';\n      el.dataset.action=route;\n      el.setAttribute('role','button');\n      el.setAttribute('tabindex','0');\n      el.style.cursor='pointer';\n      const run=e=>{\n        if(e) e.stopImmediatePropagation();\n        go(route);\n      };\n      el.addEventListener('click',run,true);\n      el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run(e)}});\n    });\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install); else install();\n  setTimeout(install,300);\n  setTimeout(install,1000);\n})();\n</script>\n'''
              s=s.replace('</body>',patch+'</body>') if '</body>' in s else s+patch
              p.write_text(s,encoding='utf-8')
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Gemini Lounge V2.7.4 quick links" || true
          git push
          rm .github/workflows/v274-quick-links.yml
          git add .github/workflows/v274-quick-links.yml
          git commit -m "Remove temporary V2.7.4 workflow" || true
          git push
