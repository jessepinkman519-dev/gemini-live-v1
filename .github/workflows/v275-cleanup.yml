name: Gemini Lounge V2.7.5 Clean Architecture
on: push
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V2.7.5 cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>Gemini Lounge — ScanCraft V2.7.3</title>', '<title>Gemini Lounge — ScanCraft V2.7.5</title>')
          for marker in ('<!-- SC-V273-INTERACTION -->', '<!-- SC-V274-QUICK-LINKS -->'):
              while marker in s:
                  start = s.find(marker)
                  end = s.find('</body>', start)
                  if start < 0 or end < 0:
                      break
                  s = s[:start] + s[end:]
          old_quick = '<div class="quick-list"><div class="quick-item"><span>View Upcoming Shows</span><b>›</b></div><div class="quick-item"><span>Share Gemini</span><b>›</b></div><div class="quick-item"><span>Visit Social Media</span><b>›</b></div><div class="quick-item"><span>Get Directions</span><b>›</b></div></div>'
          new_quick = '<div class="quick-list"><div class="quick-item" data-action="events" role="button" tabindex="0"><span>View Upcoming Shows</span><b>›</b></div><div class="quick-item" data-action="share" role="button" tabindex="0"><span>Share Gemini</span><b>›</b></div><div class="quick-item" data-action="social" role="button" tabindex="0"><span>Visit Social Media</span><b>›</b></div><div class="quick-item" data-action="directions" role="button" tabindex="0"><span>Get Directions</span><b>›</b></div></div>'
          if old_quick not in s:
              raise SystemExit('Quick Links markup not found')
          s = s.replace(old_quick, new_quick, 1)
          s = s.replace('<span class="small">View All</span>', '<button class="link" data-action="attention">View All</button>', 1)
          s = s.replace('<span class="small">View Calendar</span>', '<button class="link" data-action="calendar">View Calendar</button>', 1)
          s = s.replace('<span class="small">View All</span>', '<button class="link" data-action="events">View All</button>', 1)
          s = s.replace('onclick="loadDemoBooking()">✎ Edit Profile', 'data-action="profile">✎ Edit Profile')
          layer = r'''<!-- SC-V275-INTERACTION -->
<style>
.sc-v275-clickable{cursor:pointer!important;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}
.sc-v275-clickable:hover{transform:translateY(-2px);border-color:rgba(255,61,90,.62)!important;box-shadow:0 12px 30px rgba(0,0,0,.34),0 0 18px rgba(242,29,59,.12)!important}
.sc-v275-clickable:active{transform:translateY(0)}
.sc-v275-clickable:focus-visible{outline:2px solid #ff3d5a;outline-offset:2px}
.quick-item.sc-v275-clickable{padding-left:9px;padding-right:9px;border-radius:7px}
.link[data-action]{white-space:nowrap}
</style>
<script>
(function(){
'use strict';
const actions={
 artist:()=>showTab('artist'),
 profile:()=>{showTab('artist');setTimeout(()=>{const el=document.getElementById('bookingForm');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},80)},
 bookings:()=>showTab('bookings'),
 events:()=>showTab('events'),
 calendar:()=>showTab('calendar'),
 owner:()=>showTab('owner'),
 attention:()=>showTab('owner'),
 promotion:()=>showTab('promotion'),
 share:()=>shareGemini(),
 social:()=>visitSocial(),
 directions:()=>openDirections()
};
function activate(el){const name=el&&el.dataset&&el.dataset.action;if(name&&actions[name])actions[name]();}
function shareGemini(){
 const u=new URL(location.href);u.hash='';u.search='';
 const data={title:'Gemini Lounge',text:'Gemini Lounge — Live Music • Good Drinks • Good People',url:u.href};
 if(navigator.share){navigator.share(data).catch(()=>{});return}
 if(typeof copyText==='function'){copyText(data.url,'Gemini Lounge link copied.');return}
 if(navigator.clipboard)navigator.clipboard.writeText(data.url).then(()=>alert('Gemini Lounge link copied.'));
}
function visitSocial(){
 const profile=window.GeminiScanCraft&&window.GeminiScanCraft.state?window.GeminiScanCraft.state().artistProfile:null;
 const raw=(profile&&profile.social||'').trim();
 const url=typeof safeUrl==='function'?safeUrl(raw):(/^https?:\\/\\//i.test(raw)?raw:'');
 if(url){window.open(url,'_blank','noopener,noreferrer');return}
 alert('No valid social media URL is configured yet. Add an http:// or https:// social URL to the profile.');
}
function openDirections(){
 const q=encodeURIComponent('Gemini Lounge, Bandon, Oregon');
 window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank','noopener,noreferrer');
}
function decorate(){
 document.querySelectorAll('[data-action]').forEach(el=>{
  if(!actions[el.dataset.action])return;
  el.classList.add('sc-v275-clickable');
  if(!el.getAttribute('role'))el.setAttribute('role','button');
  if(!el.hasAttribute('tabindex'))el.setAttribute('tabindex','0');
 });
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');
 if(!el)return;
 if(e.target.closest('button:not([data-action]),a,input,select,textarea'))return;
 e.preventDefault();e.stopPropagation();activate(el);
},true);
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter'&&e.key!==' ')return;
 const el=e.target.closest('[data-action]');
 if(!el)return;
 e.preventDefault();activate(el);
});
decorate();
window.addEventListener('load',decorate);
new MutationObserver(decorate).observe(document.body,{childList:true,subtree:true});
})();
</script>
'''
          if '<!-- SC-V275-INTERACTION -->' in s:
              s = s[:s.find('<!-- SC-V275-INTERACTION -->')] + s[s.find('</body>'):]
          s = s.replace('</body>', layer + '</body>')
          p.write_text(s, encoding='utf-8')
          print('V2.7.5 cleanup applied')
          PY
      - name: Commit V2.7.5 and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build Gemini Lounge V2.7.5 clean interaction architecture"
          git push
          rm .github/workflows/v275-cleanup.yml
          git add .github/workflows/v275-cleanup.yml
          git commit -m "Remove temporary V2.7.5 workflow"
          git push
