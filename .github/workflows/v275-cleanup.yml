name: Gemini Lounge V2.7.5 Clean Architecture
on:
  push:
    paths:
      - '.github/workflows/v275-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V2.7.5 cleanup
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Gemini Lounge — ScanCraft V2.7.3</title>','<title>Gemini Lounge — ScanCraft V2.7.5</title>')
          s=s.replace('<!-- SC-V273-INTERACTION -->','<!-- SC-V273-INTERACTION-REMOVED -->')
          s=s.replace('<!-- SC-V274-QUICK-LINKS -->','<!-- SC-V274-QUICK-LINKS-REMOVED -->')
          start=s.find('<!-- SC-V273-INTERACTION-REMOVED -->')
          end=s.find('</body>',start)
          if start!=-1 and end!=-1:
              s=s[:start]+s[end:]
          old='''<div class="quick-list"><div class="quick-item"><span>View Upcoming Shows</span><b>›</b></div><div class="quick-item"><span>Share Gemini</span><b>›</b></div><div class="quick-item"><span>Visit Social Media</span><b>›</b></div><div class="quick-item"><span>Get Directions</span><b>›</b></div></div>'''
          new='''<div class="quick-list"><div class="quick-item" data-action="events" role="button" tabindex="0"><span>View Upcoming Shows</span><b>›</b></div><div class="quick-item" data-action="share" role="button" tabindex="0"><span>Share Gemini</span><b>›</b></div><div class="quick-item" data-action="social" role="button" tabindex="0"><span>Visit Social Media</span><b>›</b></div><div class="quick-item" data-action="directions" role="button" tabindex="0"><span>Get Directions</span><b>›</b></div></div>'''
          if old not in s: raise SystemExit('quick links markup not found')
          s=s.replace(old,new)
          s=s.replace('<span class="small">View All</span>','<button class="link" data-action="attention">View All</button>',1)
          s=s.replace('<span class="small">View Calendar</span>','<button class="link" data-action="calendar">View Calendar</button>',1)
          s=s.replace('<span class="small">View All</span>','<button class="link" data-action="events">View All</button>',1)
          s=s.replace('<button class="link" onclick="loadDemoBooking()">✎ Edit Profile</button>','<button class="link" data-action="profile">✎ Edit Profile</button>')
          layer=r'''
<!-- SC-V275-INTERACTION -->
<style>
.sc-v275-clickable{cursor:pointer!important;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}
.sc-v275-clickable:hover{transform:translateY(-2px);border-color:rgba(255,61,90,.62)!important;box-shadow:0 12px 30px rgba(0,0,0,.34),0 0 18px rgba(242,29,59,.12)!important}
.sc-v275-clickable:active{transform:translateY(0)}
.sc-v275-clickable:focus-visible{outline:2px solid #ff3d5a;outline-offset:2px}
.quick-item.sc-v275-clickable{padding-left:9px;padding-right:9px;border-radius:7px}
.link[data-action]{white-space:nowrap}
</style>
<script>
(function(){
  'use strict';
  const actions={
    artist:()=>showTab('artist'),
    profile:()=>{showTab('artist','bookingForm');loadDemoBooking();setTimeout(()=>{const el=document.getElementById('bookingForm');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},120)},
    bookings:()=>showTab('bookings'),
    events:()=>showTab('events'),
    calendar:()=>showTab('calendar'),
    owner:()=>showTab('owner'),
    attention:()=>showTab('owner'),
    promotion:()=>showTab('promotion'),
    share:()=>shareGemini(),
    social:()=>visitSocial(),
    directions:()=>openDirections()
  };
  function activate(el){
    const name=el?.dataset?.action;
    if(name&&actions[name]) actions[name]();
  }
  function shareGemini(){
    const data={title:'Gemini Lounge',text:'Gemini Lounge — Live Music • Good Drinks • Good People',url:location.href.split('#')[0]};
    if(navigator.share){navigator.share(data).catch(()=>{});return}
    copyText(data.url,'Gemini Lounge link copied.');
  }
  function visitSocial(){
    const url=(window.GeminiScanCraft?.state?.()?.artistProfile?.social||'').trim();
    if(/^https?:\\/\\//i.test(url)){window.open(url,'_blank','noopener,noreferrer');return}
    alert('No social media URL is configured yet. Add the artist or Gemini social URL in the profile data before using this link.');
  }
  function openDirections(){
    const q=encodeURIComponent('Gemini Lounge, Bandon, Oregon');
    window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank','noopener,noreferrer');
  }
  function decorate(){
    document.querySelectorAll('[data-action]').forEach(el=>{
      if(el.dataset.scV275Bound)return;
      if(!actions[el.dataset.action])return;
      el.dataset.scV275Bound='1';
      el.classList.add('sc-v275-clickable');
      if(!el.getAttribute('role'))el.setAttribute('role','button');
      if(!el.hasAttribute('tabindex'))el.setAttribute('tabindex','0');
    });
  }
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]');
    if(!el)return;
    if(e.target.closest('button:not([data-action]),a,input,select,textarea'))return;
    e.preventDefault();e.stopPropagation();activate(el);
  },true);
  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const el=e.target.closest('[data-action]');
    if(!el)return;
    e.preventDefault();activate(el);
  });
  decorate();
  window.addEventListener('load',decorate);
  const observer=new MutationObserver(decorate);
  observer.observe(document.body,{childList:true,subtree:true});
})();
</script>
'''
          s=s.replace('</body>',layer+'</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build Gemini Lounge V2.7.5 clean interaction architecture" || true
          git push
          rm .github/workflows/v275-cleanup.yml
          git add .github/workflows/v275-cleanup.yml
          git commit -m "Remove temporary V2.7.5 workflow" || true
          git push
